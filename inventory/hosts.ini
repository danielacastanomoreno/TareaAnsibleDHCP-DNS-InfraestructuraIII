# 192.168.56.107 presta DHCP y DNS simultáneamente.
# 192.168.56.109 es el CLIENTE de la red: no se gestiona con Ansible
# (no aparece como managed host), solo se referencia como dato en
# group_vars/all.yml para publicarlo en DNS y/o reservarlo en DHCP.

[dhcp]
net-server ansible_host=192.168.56.107

[dns]
net-server ansible_host=192.168.56.107

[servers:children]
dhcp
dns

[servers:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python3

---
- name: Detener y deshabilitar named si estaba presente en esta VM
  ansible.builtin.service:
    name: named
    state: stoppedmcli
    enabled: false
  when: dhcpd_disable_local_server_services | bool
  failed_when: false

- name: Detener y deshabilitar dhcpd si estaba presente en esta VM
  ansible.builtin.service:
    name: dhcpd
    state: stopped
    enabled: false
  when: dhcpd_disable_local_server_services | bool
  failed_when: false

# Requiere: ansible-galaxy collection install community.general
- name: Cambiar la conexión de red de IP estática a DHCP (method=auto)
  community.general.nmcli:
    conn_name: "{{ dhcp_client_interface }}"
    ifname: "{{ dhcp_client_interface }}"
    type: ethernet
    method4: auto
    method6: disabled
    state: present
  notify: reactivar conexion de red

- name: Verificar que la interfaz ya no tiene IP fija asignada manualmente
  ansible.builtin.command: "dhcp_client_nmcli -g ipv4.method connection show {{ dhcp_client_interface }}"
  register: dhcp_client_nmcli_method
  changed_when: false

- name: Confirmar método DHCP aplicado
  ansible.builtin.assert:
    that:
      - "'auto' in dhcp_client_nmcli_method.stdout"
    fail_msg: "La conexión {{ dhcp_client_interface }} sigue en modo estático."
    success_msg: "Conexión {{ dhcp_client_interface }} en modo DHCP (auto)."

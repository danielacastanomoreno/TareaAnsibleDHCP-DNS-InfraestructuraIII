---
- name: Instalar dhcp-server
  ansible.builtin.package:
    name: dhcp-server
    state: present

- name: Determinar interfaz DHCP efectiva
  ansible.builtin.set_fact:
    dhcp_interface_effective: "{{ dhcp_interface if (dhcp_interface | length > 0) else ansible_default_ipv4.interface }}"

- name: Fijar interfaz en /etc/sysconfig/dhcpd (mecanismo soportado por dhcpd.service en RHEL9)
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/dhcpd
    regexp: '^DHCPDARGS='
    line: 'DHCPDARGS="{{ dhcp_interface_effective }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: restart dhcpd

- name: Desplegar dhcpd.conf
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart dhcpd

- name: Validar dhcpd.conf
  ansible.builtin.command: dhcpd -t -cf /etc/dhcp/dhcpd.conf
  changed_when: false

- name: Abrir servicio DHCP en firewalld
  ansible.posix.firewalld:
    service: dhcp
    permanent: true
    immediate: true
    state: enabled
  when: manage_firewalld | bool

- name: Habilitar e iniciar dhcpd
  ansible.builtin.service:
    name: dhcpd
    state: started
    enabled: true

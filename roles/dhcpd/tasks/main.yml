---
- name: Install dhcp-server
  ansible.builtin.package:
    name: dhcp-server
    state: present

- name: Determine effective DHCP interface
  ansible.builtin.set_fact:
    dhcpd_interface_effective: >-
      {{ dhcp_interface if (dhcp_interface | default('') | length > 0)
         else ansible_default_ipv4.interface }}

- name: Deploy dhcpd.conf
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: "{{ dhcp_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart dhcpd

- name: Validate dhcpd.conf syntax (dhcpd -t)
  ansible.builtin.command: "dhcpd -t -cf {{ dhcp_conf_path }}"
  changed_when: false
  register: dhcpd_check_result

- name: Fijar interfaz de escucha de dhcpd (sysconfig)
  ansible.builtin.lineinfile:
    path: "{{ dhcp_sysconfig_path }}"
    regexp: "^DHCPDARGS="
    line: 'DHCPDARGS="{{ dhcp_interface_effective }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart dhcpd

- name: Open DHCP port (67/udp) in firewalld
  ansible.posix.firewalld:
    service: dhcp
    permanent: true
    immediate: true
    state: enabled
  when: manage_firewalld
  notify: Reload firewalld

- name: Enable and start dhcpd
  ansible.builtin.service:
    name: dhcpd
    state: started
    enabled: true

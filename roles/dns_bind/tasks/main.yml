---
- name: Instalar BIND y utilidades
  ansible.builtin.package:
    name:
      - bind
      - bind-utils
    state: present

- name: Desplegar named.conf (validado al escribir)
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: "0640"
    validate: "named-checkconf %s"
  notify: reload named

- name: Desplegar zona forward
  ansible.builtin.template:
    src: zone.forward.j2
    dest: "/var/named/{{ domain_name }}.zone"
    owner: root
    group: named
    mode: "0640"
  notify: reload named

- name: Desplegar zona reverse
  ansible.builtin.template:
    src: zone.reverse.j2
    dest: "/var/named/{{ reverse_zone }}.zone"
    owner: root
    group: named
    mode: "0640"
  notify: reload named

- name: Validar named.conf (post-check explícito)
  ansible.builtin.command: named-checkconf /etc/named.conf
  changed_when: false

- name: Validar zona forward
  ansible.builtin.command: "named-checkzone {{ domain_name }} /var/named/{{ domain_name }}.zone"
  changed_when: false

- name: Validar zona reverse
  ansible.builtin.command: "named-checkzone {{ reverse_zone }} /var/named/{{ reverse_zone }}.zone"
  changed_when: false

- name: Comprobar estado de SELinux
  ansible.builtin.command: getenforce
  register: dns_bind_selinux_status.stdout
  changed_when: false
  check_mode: false

- name: Restaurar contexto SELinux en /var/named
  ansible.builtin.command: restorecon -Rv /var/named
  changed_when: false
  when: "'Disabled' not in dns_bind_selinux_status.stdout"

- name: Abrir servicio DNS en firewalld
  ansible.posix.firewalld:
    service: dns
    permanent: true
    immediate: true
    state: enabled
  when: manage_firewalld | bool

- name: Habilitar e iniciar named
  ansible.builtin.service:
    name: named
    state: started
    enabled: true

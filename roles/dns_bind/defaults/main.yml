---
dns_bind_domain_name: "danielacastmor.local"
dns_bind_server_hostname: "dns1"
dns_bind_server_ip: "192.168.56.109"
dns_bind_reverse_zone: "56.168.192.in-addr.arpa" # Corresponse a 192.168.56.0/24

dns_bind_forwarders_enabled: true
dns_bind_forwarders: []
dns_bind_recursion: true
dns_bind_allow_query:
  - "any"
dns_bind_listen_on:
  - "any"

dns_bind_serial: "2026090801"

dns_bind_records_a: []
dns_bind_records_ptr: []
dns_bind_conf_dir: /etc/named
dns_bind_zones_dir: /var/named
dns_bind_named_conf_path: /etc/named.conf
dns_bind_zone_forward_file: "{{ bind_zones_dir }}/{{ domain_name }}.zone"
dns_bind_zone_reverse_file: "{{ bind_zones_dir }}/{{ reverse_zone }}.zone"

dns_bind_manage_firewalld: true

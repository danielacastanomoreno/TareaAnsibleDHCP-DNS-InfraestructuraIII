
# DNS (rol dns_bind)
domain_name: "danielacastmor.local"
dns_server_hostname: "dns1"
dns_server_ip: "192.168.56.109"
reverse_zone: "56.168.192.in-addr.arpa" # Corresponse a 192.168.56.0/24

dns_forwarders_enabled: true
dns_forwarders:
  - 8.8.8.8
  - 1.1.1.1

dns_recursion: true
dns_allow_query:
  - "any"
dns_listen_on:
  - "any"

# Recomended serial: YYYYMMDDnn
dns_serial: "2026090801"

dns_records_a:
  - name: dns1
  - ip: 192.168.56.109
  - name: dhcp1
  - ip: 192.168.56.107
  - name: host1
  - ip: 192.168.56.110
  - name: host2
  - ip: 192.168.56.111

dns_records_ptr:
  - ip_last_octet: 109
    hostname: dns1
  - ip_last_octet: 110
    hostname: host1
  - ip_last_octet: 111
    hostname: host2


# DHCP (rol dhcp)
# If there is no defined or empty, the interface is autodetected by the role
# through ansible_default_ipv4.interface
dhcp_interface: ""

dhcp_domain_name: "{{ domain_name }}"
dhcp_domain_name_servers:
  - "{{ dns_server_ip }}"

dhcp_default_lease_time: 600
dhcp_max_lease_time: 7200

dhcp_subnets:
  - network: 192.168.56.0
    netmask: 255.255.255.0
    range_start: 192.168.56.200
    range_end: 192.168.56.300
    routers: 192.168.56.1
    broadcast: 192.168.56.255

# Optional reservatations by MAC address. Commented example
dhcp_reservations: []
# dhcp_reservations:
#   - name: host1
#     mac: "08:00:27:AA:BB:CC"
#     ip: 192.168.56.50

manage_firewalld: true